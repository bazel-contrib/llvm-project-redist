# Opens a pull request to the Bazel Central Registry with the module entry
# for a given release. Called automatically by the release workflow, or
# triggered manually to retry a failed publish for an existing release.
name: Publish to BCR

on:
  workflow_call:
    inputs:
      tag_name:
        required: true
        type: string
      author_name:
        required: true
        type: string
      author_email:
        required: true
        type: string
    secrets:
      BCR_PUBLISH_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish (e.g. llvmorg-17.0.3.bcr.5)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  MODULE_NAME: llvm-project
  TAG_PREFIX: "llvmorg-"
  REGISTRY: bazelbuild/bazel-central-registry
  REGISTRY_FORK: bazel-contrib/bazel-central-registry

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for release assets
        if: github.event_name == 'release'
        run: |
          echo "Waiting 60s for release assets to finish uploading..."
          sleep 60

      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse version
        id: version
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag_name || github.event.release.tag_name }}"
          VERSION="${TAG#${TAG_PREFIX}}"
          LLVM_VERSION=$(echo "$VERSION" | sed 's/\.bcr\.[0-9]*$//')

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "llvm_version=${LLVM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${MODULE_NAME}@${VERSION} from tag ${TAG}"

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          ARCHIVE="llvm-project-${VERSION}.bzl.tar.zst"

          for attempt in 1 2 3; do
            echo "Attempt ${attempt}: downloading release assets..."
            if gh release download "${TAG}" \
                --repo "${{ github.repository }}" \
                --pattern "${ARCHIVE}" \
                --pattern "${ARCHIVE}.intoto.jsonl"; then
              echo "Download successful"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "ERROR: failed to download assets after 3 attempts"
              exit 1
            fi
            echo "Retrying in 30s..."
            sleep 30
          done

      - name: Extract MODULE.bazel from archive
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ARCHIVE="llvm-project-${VERSION}.bzl.tar.zst"
          PREFIX="llvm-project-${VERSION}.bzl"

          tar --zstd -xf "${ARCHIVE}" "${PREFIX}/MODULE.bazel"
          mv "${PREFIX}/MODULE.bazel" MODULE.bazel
          rm -rf "${PREFIX}"

          echo "Extracted MODULE.bazel:"
          cat MODULE.bazel

      - name: Compute integrity
        id: integrity
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ARCHIVE="llvm-project-${VERSION}.bzl.tar.zst"
          ARCHIVE_INTOTO="${ARCHIVE}.intoto.jsonl"

          ARCHIVE_INTEGRITY="sha256-$(sha256sum "${ARCHIVE}" | cut -d' ' -f1 | xxd -r -p | base64 -w0)"
          ARCHIVE_INTOTO_INTEGRITY="sha256-$(sha256sum "${ARCHIVE_INTOTO}" | cut -d' ' -f1 | xxd -r -p | base64 -w0)"
          MODULE_INTEGRITY="sha256-$(sha256sum MODULE.bazel | cut -d' ' -f1 | xxd -r -p | base64 -w0)"

          echo "archive_integrity=${ARCHIVE_INTEGRITY}" >> "$GITHUB_OUTPUT"
          echo "archive_intoto_integrity=${ARCHIVE_INTOTO_INTEGRITY}" >> "$GITHUB_OUTPUT"
          echo "module_integrity=${MODULE_INTEGRITY}" >> "$GITHUB_OUTPUT"

      - name: Render source.json
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          INTEGRITY="${{ steps.integrity.outputs.archive_integrity }}"

          sed -e "s|{VERSION}|${VERSION}|g" \
              -e "s|{TAG}|${TAG}|g" \
              -e "s|{OWNER}|${OWNER}|g" \
              -e "s|{REPO}|${REPO}|g" \
              -e "s|\"integrity\": \"\"|\"integrity\": \"${INTEGRITY}\"|" \
              .bcr/source.template.json > source.json

          echo "source.json:"
          cat source.json

      - name: Attest MODULE.bazel and source.json
        id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            MODULE.bazel
            source.json

      - name: Upload MODULE.bazel and source.json attestations to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          cp "${{ steps.attest.outputs.bundle-path }}" MODULE.bazel.intoto.jsonl
          cp "${{ steps.attest.outputs.bundle-path }}" source.json.intoto.jsonl

          gh release upload "${TAG}" \
            --repo "${{ github.repository }}" \
            --clobber \
            MODULE.bazel.intoto.jsonl \
            source.json.intoto.jsonl

          INTOTO_INTEGRITY="sha256-$(sha256sum "${{ steps.attest.outputs.bundle-path }}" | cut -d' ' -f1 | xxd -r -p | base64 -w0)"
          echo "intoto_integrity=${INTOTO_INTEGRITY}" >> "$GITHUB_OUTPUT"
        id: upload_attestations

      - name: Build attestations.json
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          ARCHIVE="llvm-project-${VERSION}.bzl.tar.zst"
          RELEASE_URL="https://github.com/${OWNER}/${REPO}/releases/download/${TAG}"
          META_INTEGRITY="${{ steps.upload_attestations.outputs.intoto_integrity }}"

          cat > attestations.json <<EOF
          {
            "mediaType": "application/vnd.build.bazel.registry.attestation+json;version=1.0.0",
            "attestations": {
              "${ARCHIVE}": {
                "url": "${RELEASE_URL}/${ARCHIVE}.intoto.jsonl",
                "integrity": "${{ steps.integrity.outputs.archive_intoto_integrity }}"
              },
              "MODULE.bazel": {
                "url": "${RELEASE_URL}/MODULE.bazel.intoto.jsonl",
                "integrity": "${META_INTEGRITY}"
              },
              "source.json": {
                "url": "${RELEASE_URL}/source.json.intoto.jsonl",
                "integrity": "${META_INTEGRITY}"
              }
            }
          }
          EOF

          echo "attestations.json:"
          cat attestations.json

      - name: Clone registry fork
        env:
          GH_TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REGISTRY_FORK}.git" registry
          cd registry
          git remote add upstream "https://github.com/${REGISTRY}.git"
          git fetch upstream main
          git checkout -B "${MODULE_NAME}-${{ steps.version.outputs.version }}" upstream/main

      - name: Write module entry
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          LLVM_VERSION="${{ steps.version.outputs.llvm_version }}"
          MODULE_DIR="registry/modules/${MODULE_NAME}/${VERSION}"

          mkdir -p "${MODULE_DIR}"
          cp MODULE.bazel "${MODULE_DIR}/MODULE.bazel"
          cp source.json "${MODULE_DIR}/source.json"
          cp attestations.json "${MODULE_DIR}/attestations.json"
          cp "versions/${LLVM_VERSION}/presubmit.yml" "${MODULE_DIR}/presubmit.yml"

      - name: Update metadata.json
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          METADATA="registry/modules/${MODULE_NAME}/metadata.json"

          if [ ! -f "$METADATA" ]; then
            cp .bcr/metadata.template.json "$METADATA"
          fi

          python3 -c "
          import json, sys
          with open('$METADATA') as f:
              meta = json.load(f)
          if '$VERSION' not in meta.get('versions', []):
              meta.setdefault('versions', []).append('$VERSION')
          with open('$METADATA', 'w') as f:
              json.dump(meta, f, indent=4)
              f.write('\n')
          "

      - name: Push and create PR
        env:
          GH_TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          BRANCH="${MODULE_NAME}-${VERSION}"
          cd registry
          git config user.name "${{ inputs.author_name || github.actor }}"
          git config user.email "${{ inputs.author_email || format('{0}+{1}@users.noreply.github.com', github.actor_id, github.actor) }}"

          git add "modules/${MODULE_NAME}/"
          git commit -m "${MODULE_NAME}@${VERSION}"
          git push --force -u origin "${BRANCH}"

          gh pr create \
            --repo "${REGISTRY}" \
            --head "${REGISTRY_FORK%%/*}:${BRANCH}" \
            --title "${MODULE_NAME}@${VERSION}" \
            --body "Release: https://github.com/${{ github.repository }}/releases/tag/${TAG}"
