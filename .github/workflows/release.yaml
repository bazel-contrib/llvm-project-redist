# Builds release archives, generates SLSA attestations, creates a GitHub release,
# and opens a Bazel Central Registry PR. Both halves of the pipeline use the
# bazel-contrib reusable workflows so the resulting attestations are signed
# under builder identities the BCR's slsa-verifier trusts.
#
# Triggered manually with the LLVM directory name (e.g. 17.0.4). The release
# version is read from versions/{llvm_version}/version.txt.
name: Release

on:
  workflow_dispatch:
    inputs:
      llvm_version:
        description: "LLVM base version (e.g. 17.0.3). Release version is read from versions/{llvm_version}/version.txt."
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Parse the requested version, promote the per-version presubmit.yml into
  # .bcr/ so the release tag's tree carries the right BCR template, and push
  # the tag. The detached commit is reachable only from the tag — main is
  # unchanged.
  parse:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      llvm_version: ${{ steps.version.outputs.llvm_version }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse version
        id: version
        run: |
          set -euo pipefail
          LLVM_VERSION="${{ inputs.llvm_version }}"
          VERSION_FILE="versions/${LLVM_VERSION}/version.txt"
          if [ ! -f "$VERSION_FILE" ]; then
            echo "ERROR: ${VERSION_FILE} not found"
            exit 1
          fi
          VERSION=$(tr -d '[:space:]' < "$VERSION_FILE")
          TAG="llvmorg-${VERSION}"
          echo "llvm_version=${LLVM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${VERSION} (tag: ${TAG})"

      - name: Promote per-version presubmit.yml into .bcr/ and tag
        run: |
          set -euo pipefail
          LLVM_VERSION="${{ steps.version.outputs.llvm_version }}"
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"

          cp "versions/${LLVM_VERSION}/presubmit.yml" .bcr/presubmit.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .bcr/presubmit.yml
          git commit --allow-empty -m "Promote versions/${LLVM_VERSION}/presubmit.yml into .bcr/ for ${TAG}"
          git tag -a "${TAG}" -m "LLVM ${VERSION}"
          git push origin "${TAG}"

  # Build the archives, attest provenance under the BCR-trusted release_ruleset
  # builder ID, and publish a GitHub release. The actual build runs in
  # .github/workflows/release_prep.sh (hardcoded path in release_ruleset.yaml).
  release:
    needs: parse
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@1d798ff015ed0696433e01e2c3ccbb2abefadad7 # v7.7.0
    with:
      release_files: |
        llvm-project-*.bzl.tar.xz
        llvm-project-*.bzl.tar.xz.sha256
        llvm-project-*.bzl.tar.xz.integrity
        llvm-project-*.bzl.tar.zst
        llvm-project-*.bzl.tar.zst.sha256
        llvm-project-*.bzl.tar.zst.integrity
      # //tools/... covers our internal tests including validate_patches_repo_test.
      # Avoid //... — that would pull upstream LLVM targets.
      bazel_test_command: "bazel test //tools/..."
      prerelease: false
      # Use only the curated notes from release_prep.sh (via tools:release_notes).
      # The default appends GitHub's "What's Changed" since the previous tag,
      # which double-counts commits and includes irrelevant churn between LLVM versions.
      generate_release_notes: false
      tag_name: ${{ needs.parse.outputs.tag }}

  # Open a PR against the BCR fork. publish-to-bcr generates source.json,
  # MODULE.bazel, attestations.json, and signs the entry attestations under
  # the BCR-trusted publish builder ID. Reads .bcr/ from the release tag.
  publish:
    needs: [parse, release]
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: bazel-contrib/publish-to-bcr/.github/workflows/publish.yaml@c316f1611511a40423572303f66c80bb30bfe2f8 # v1.4.1
    with:
      tag_name: ${{ needs.parse.outputs.tag }}
      tag_prefix: "llvmorg-"
      registry_fork: bazel-contrib/bazel-central-registry
      draft: false
      author_name: bazel-contrib-bot
      author_email: 210917734+bazel-contrib-bot@users.noreply.github.com
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}
